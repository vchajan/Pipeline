name: pipeline-monitor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline_net

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "if [ -f alembic.ini ]; then
        alembic upgrade head;
      else
        echo 'Alembic is not configured yet; skipping migrations for Phase 1.';
      fi"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline}
      SQLITE_DATABASE_URL: ${SQLITE_DATABASE_URL:-sqlite:///./pipeline_monitor.db}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - pipeline_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "if [ -f app/main.py ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8000;
      else
        echo 'backend/app/main.py is not implemented yet; Phase 1 container is waiting.';
        tail -f /dev/null;
      fi"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Big Data Pipeline Monitor}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline}
      SQLITE_DATABASE_URL: ${SQLITE_DATABASE_URL:-sqlite:///./pipeline_monitor.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-pipeline-runs}
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      BACKEND_CORS_ORIGINS: '["http://localhost:8088","http://localhost:5173"]'
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pipeline-monitor}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pipeline-monitor-web}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-pipeline-monitor-web}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/pipeline-monitor}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/pipeline-monitor/protocol/openid-connect/certs}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - pipeline_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "if [ -f app/workers/worker.py ]; then
        python -m app.workers.worker;
      else
        echo 'backend/app/workers/worker.py is not implemented yet; Phase 1 container is waiting.';
        tail -f /dev/null;
      fi"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline}
      SQLITE_DATABASE_URL: ${SQLITE_DATABASE_URL:-sqlite:///./pipeline_monitor.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-pipeline-runs}
      WORKER_ID: ${WORKER_ID:-local-worker}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - pipeline_net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.scheduler
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline}
      SQLITE_DATABASE_URL: ${SQLITE_DATABASE_URL:-sqlite:///./pipeline_monitor.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-pipeline-runs}
      SCHEDULER_ID: ${SCHEDULER_ID:-local-scheduler}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-30}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    networks:
      - pipeline_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: >
      sh -c "if [ -f package.json ]; then
        npm run dev -- --host 0.0.0.0 --port 5173;
      else
        echo 'frontend/package.json is not implemented yet; Phase 1 container is waiting.';
        tail -f /dev/null;
      fi"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-keycloak}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-pipeline-monitor}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-pipeline-monitor-web}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - pipeline_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pipeline_net

volumes:
  postgres_data:
  redis_data:

networks:
  pipeline_net:
    driver: bridge
